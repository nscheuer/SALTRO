name: saltro-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      # Don't cancel the Debug job if Release fails (or vice versa).
      # The two surface different bug classes; both signals are useful.
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    name: build-and-test (${{ matrix.build_type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build ccache python3-pip catch2

      - name: Install Python packages
        run: |
          pip install pytest numpy

      - name: Configure
        # Debug builds enable Eigen's runtime size/shape assertions (which
        # are no-ops under Release's NDEBUG).  This catches a class of
        # silent-UB bugs where e.g. `Block<Ref<Matrix>, -1, 1>::resize(...)`
        # is called with a size mismatch.  See
        # docs/test_audit_silent_release_bugs.md for the FP_al fixture
        # instance that motivated adding the Debug job.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSALTRO_BUILD_PYTHON=ON

      - name: Build
        run: |
          cmake --build build -- -j4

      - name: Run C++ tests
        run: |
          cd build
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            ctest --output-on-failure -E "optimizer_test_alilqr"
          else
            ctest --output-on-failure
          fi

      - name: Run Python tests
        run: |
          cd tests
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            pytest -q -k "not test_alilqr"
          else
            pytest -q
          fi
